<script>
// ==============================================
// COMPARATEUR AUTOGESTION vs GESTIONNAIRE — Quatre Piliers
// Chiffre le coût réel du bénévolat (temps, risques, sinistres)
// face au tarif d'un gestionnaire professionnel.
// ==============================================

const LEAD_URL = "";

// Constantes — moyennes industrie québécoise 2025-2026
// Chaque incident est amorti sur sa fréquence typique (en années) entre occurrences :
// un sinistre majeur arrive ~1× / 10 ans, on ne peut donc pas le projeter comme un coût annuel.
const INCIDENT_DATA = {
  sinistre:      {cost: 8000,  freqYears: 10, label: "Sinistre mal coordonné"},
  erreur_compta: {cost: 3000,  freqYears: 4,  label: "Erreur comptable"},
  aga_reportee:  {cost: 1500,  freqYears: 5,  label: "AGA reportée"},
  conflit:       {cost: 5000,  freqYears: 8,  label: "Conflit majeur"},
  surcout:       {cost: 12000, freqYears: 8,  label: "Surcoût travaux >15 %"}
};
const PRO_RATE_PER_UNIT_MONTH = 30; // $ / unité / mois (médiane Quatre Piliers)
const ASSURANCE_RISK = 800;          // $ / an de risque D&O non couvert
const DEFAULT_TAUX = "50";

const QS = [
  {
    id:"syndicat",
    type:"fields",
    label:"Étape 1 sur 7",
    q:"Caractéristiques de votre immeuble",
    help:"Quelques informations factuelles pour calibrer le comparatif. Vous renseignerez le nom du syndicat à la fin.",
    fields:[

      {key:"annee", label:"Année de construction *", ph:"Ex : 2008", type:"number"}
    ]
  },
  {
    id:"ca",
    type:"fields",
    label:"Étape 2 sur 7",
    q:"Composition de votre conseil d'administration",
    help:"Ces données calibrent l'estimation et reflètent la maturité de votre CA.",
    fields:[
      {key:"nb_admins", label:"Nombre d'administrateurs actifs *", ph:"Ex : 3", type:"number"},
      {
        key:"anciennete",
        label:"Ancienneté moyenne des administrateurs *",
        type:"radio",
        opts:[
          {v:"recent", t:"Moins d'un an"},
          {v:"intermediaire", t:"Entre 1 et 3 ans"},
          {v:"experimente", t:"Plus de 3 ans"}
        ]
      }
    ]
  },
  {
    id:"temps",
    type:"fields",
    label:"Étape 3 sur 7",
    q:"Temps total consacré par votre CA",
    help:"Estimez les heures par mois cumulées par TOUS les administrateurs réunis. Cliquez sur le « ? » pour la grille de repères.",
    fields:[
      {
        key:"heures_mois",
        label:"Heures par mois (total CA) *",
        ph:"Ex : 18",
        type:"number",
        suffix:"h/mois",
        tooltip:"<strong>Postes typiques à additionner :</strong><br>· Saisie comptable et banque : ~6 h/mois<br>· AGA et préparation : ~20 h/an = ~2 h/mois<br>· Urgences et fournisseurs : ~3 h/mois<br>· Communications aux copropriétaires : ~2 h/mois<br>· Réunions du CA : ~3 h/mois<br>· Suivi des travaux et appels d'offres : ~3 h/mois<br><br><strong>Grille indicative par taille :</strong><br>· Moins de 12 unités : 8 à 15 h/mois<br>· De 12 à 30 unités : 15 à 30 h/mois<br>· Plus de 30 unités : 30 à 60 h/mois<br><br>Soyez réaliste — la sous-estimation est très fréquente."

      {

        type:"number",

        tooltip:"<strong>Méthodologie :</strong> estimez ce que coûterait votre temps si vous le faisiez payer — salaire net horaire si vous étiez salarié, ou tarif facturé si vous étiez consultant.<br><br><strong>Repères raisonnables :</strong><br>· Salarié à 60 000 $/an net ≈ 30 $/h<br>· Cadre intermédiaire ≈ 40 à 60 $/h<br>· Profession libérale ≈ 75 à 150 $/h<br>· Retraité actif valorisé ≈ 25 à 40 $/h<br><br>La médiane observée sur les CA québécois se situe autour de 50 $/h."

    ]
  }

let step = 0, ans = {taux_horaire: DEFAULT_TAUX}, phase = "form", formErr = "", result = null;
let tooltips = {};

function toggleTooltip(key){ tooltips[key] = !tooltips[key]; render(); }
function selectOpt(id, val){ ans[id] = val; formErr = ""; render(); }
function toggleMulti(id, val, noneOpt){
  if(!Array.isArray(ans[id])) ans[id] = [];
  const arr = ans[id];
  const i = arr.indexOf(val);
  if(i > -1){
    arr.splice(i, 1);
  } else {
    if(noneOpt && val === noneOpt){
      ans[id] = [val];
    } else {
      if(noneOpt){
        const j = arr.indexOf(noneOpt);
        if(j > -1) arr.splice(j, 1);
      }
      arr.push(val);
    }
  }
  formErr = "";
  render();
}
function setField(key, val){ ans[key] = val; }
function prev(){ if(step > 0) step--; formErr = ""; render(); }
function restart(){
  step = 0;
  ans = {taux_horaire: DEFAULT_TAUX};
  phase = "form";
  formErr = "";
  result = null;
  tooltips = {};
  render();
}

function fmt(n){
  if(typeof n !== "number" || isNaN(n)) return "—";
  return new Intl.NumberFormat('fr-CA', {maximumFractionDigits:0}).format(Math.round(n));
}
function fmtCAD(n){ return fmt(n) + " $"; }
function fmtSigned(n){
  const sign = n > 0 ? "+" : n < 0 ? "−" : "";
  return sign + fmt(Math.abs(n)) + " $";
}

function compute(){
  const nbUnites = parseInt(ans.nb_unites) || 0;
  const nbAdmins = parseInt(ans.nb_admins) || 0;
  const heuresMois = parseFloat(ans.heures_mois) || 0;
  const tauxHoraire = parseFloat(ans.taux_horaire) || parseFloat(DEFAULT_TAUX);

  const coutTemps = Math.round(heuresMois * 12 * tauxHoraire);

  const incidents = Array.isArray(ans.incidents) ? ans.incidents.filter(i => i !== "aucun") : [];
  let coutIncidentsAnnualise = 0;
  const incidentsBreakdown = [];
  incidents.forEach(i => {
    const data = INCIDENT_DATA[i];
    if(!data) return;
    const annualCost = data.cost / data.freqYears;
    coutIncidentsAnnualise += annualCost;
    incidentsBreakdown.push({
      id: i,
      label: data.label,
      cost: data.cost,
      freqYears: data.freqYears,
      annualCost: annualCost
    });
  });

  const risqueNonAssure = ans.assurance === "non" ? ASSURANCE_RISK : 0;

  const coutTotalAutogestion = coutTemps + coutIncidentsAnnualise + risqueNonAssure;
  const coutProAnnuel = nbUnites * PRO_RATE_PER_UNIT_MONTH * 12;
  const ecartAnnuel = coutTotalAutogestion - coutProAnnuel;
  const ecart3ans = ecartAnnuel * 3;

  let verdict, color, label, txt, icon;
  if(ecart3ans > 15000){
    verdict = "pro_avantageux";
    color = "#A32D2D";
    label = "L'autogestion vous coûte plus cher";
    txt = `Sur 3 ans, votre autogestion coûte environ ${fmtCAD(Math.abs(ecart3ans))} de plus qu'un gestionnaire professionnel équivalent. Le bénévolat a un prix que les CA sous-estiment souvent.`;
    icon = "!";
  } else if(ecart3ans >= 0){
    verdict = "serre";
    color = "#854F0B";
    label = "Décision serrée — autres critères à peser";
    txt = "L'écart financier sur 3 ans est faible. Les critères qualitatifs (fatigue, recrutement, conformité, sérénité) feront pencher la balance dans votre décision.";
    icon = "△";
  } else {
    verdict = "auto_rentable";
    color = "#0F6E56";
    label = "Votre autogestion est rentable financièrement";
    txt = `Sur 3 ans, votre autogestion fait économiser ${fmtCAD(Math.abs(ecart3ans))} au syndicat par rapport à un gestionnaire professionnel. Restez vigilants sur les critères qualitatifs ci-dessous.`;
    icon = "✓";
  }

  return {
    nbUnites, nbAdmins, heuresMois, tauxHoraire,
    coutTemps, coutIncidentsAnnualise, risqueNonAssure,
    coutTotalAutogestion, coutProAnnuel,
    ecartAnnuel, ecart3ans,
    incidentsBreakdown, primeAnnuelle: parseFloat(ans.prime_annuelle) || null,
    verdict, color, label, txt, icon
  };
}

function validate(){
  formErr = "";
  const q = QS[step];

  if(q.type === "radio"){
    if(!ans[q.id]){ formErr = "Veuillez sélectionner une réponse."; return false; }
    if(q.extraInput && ans[q.id] === q.extraInput.showWhen){
      const v = ans[q.extraInput.key];
      if(v === undefined || v === null || (typeof v === "string" && !v.trim())){
        formErr = `Veuillez renseigner « ${q.extraInput.label.replace(" *","")} ».`;
        return false;
      }
      const n = parseFloat(v);
      if(isNaN(n) || n < 0){
        formErr = `« ${q.extraInput.label.replace(" *","")} » doit être un nombre positif.`;
        return false;
      }
    }
    return true;
  }

  if(q.type === "multi"){
    if(!Array.isArray(ans[q.id]) || ans[q.id].length === 0){
      formErr = "Veuillez sélectionner au moins une option (ou « Aucun »).";
      return false;
    }
    return true;
  }

  if(q.type === "fields"){
    for(const f of q.fields){
      const required = f.label.includes("*");
      if(f.type === "radio"){
        if(required && !ans[f.key]){
          formErr = `Veuillez sélectionner « ${f.label.replace(" *","")} ».`;
          return false;
        }
        continue;
      }
      const val = ans[f.key];
      if(required && (val === undefined || val === null || (typeof val === "string" && !val.trim()))){
        formErr = `Veuillez remplir le champ « ${f.label.replace(" *","")} ».`;
        return false;
      }
      if(f.type === "number" && val !== undefined && val !== ""){
        const n = parseFloat(val);
        if(isNaN(n) || n < 0){
          formErr = `« ${f.label.replace(" *","")} » doit être un nombre positif.`;
          return false;
        }
      }
      if(f.type === "email" && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){
        formErr = "Adresse courriel invalide."; return false;
      }
    }
    if(q.id === "syndicat"){
      const y = parseInt(ans.annee);
      const now = new Date().getFullYear();
      if(isNaN(y) || y < 1800 || y > now + 1){ formErr = "Année de construction invalide."; return false; }
      const u = parseInt(ans.nb_unites);
      if(isNaN(u) || u < 2){ formErr = "Le nombre d'unités doit être au moins 2."; return false; }
    }
    if(q.id === "ca"){
      const a = parseInt(ans.nb_admins);
      if(isNaN(a) || a < 1){ formErr = "Le nombre d'administrateurs doit être au moins 1."; return false; }
    }
    if(q.id === "temps"){
      const h = parseFloat(ans.heures_mois);
      if(isNaN(h) || h <= 0){ formErr = "Indiquez un nombre d'heures par mois supérieur à 0."; return false; }
    }
    if(q.id === "taux"){
      const t = parseFloat(ans.taux_horaire);
      if(isNaN(t) || t <= 0){ formErr = "Indiquez un taux horaire supérieur à 0."; return false; }
    }
    return true;
  }
  return true;
}

function nextStep(){
  if(!validate()){ render(); return; }
  if(step < QS.length - 1){ step++; render(); return; }
  result = compute();
  phase = "result";
  if(LEAD_URL){
    try{
      fetch(LEAD_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({source:"comparateur-autogestion", answers: ans, result})
      }).catch(()=>{});
    } catch(_){}
  }
  render();
}

function renderField(f){
  const val = ans[f.key] !== undefined ? String(ans[f.key]).replace(/"/g,'&quot;') : "";
  const tooltipOpen = !!tooltips[f.key];
  const labelHTML = f.tooltip
    ? `<div class="label-row">
        <label class="input-label">${f.label}</label>
        <button type="button" class="tooltip-btn${tooltipOpen?' open':''}" onclick="toggleTooltip('${f.key}')" aria-label="Aide">?</button>
      </div>
      ${tooltipOpen ? `<div class="tooltip-box">${f.tooltip}</div>` : ""}`
    : `<label class="input-label">${f.label}</label>`;

  if(f.type === "radio"){
    return `<div class="input-group">
      ${labelHTML}
      <div class="options options-inline">${f.opts.map(o => {
        const sel = ans[f.key] === o.v;
        return `<div class="opt${sel?' selected':''}" onclick="selectOpt('${f.key}','${o.v}')">
          <div class="opt-radio"><div class="opt-dot"></div></div>
          <div class="opt-body"><div class="opt-text">${o.t}</div></div>
        </div>`;
      }).join("")}</div>
    </div>`;
  }

  const inputCls = (f.prefix?"with-prefix":"") + (f.suffix?" with-suffix":"");
  return `<div class="input-group">
    ${labelHTML}
    <div class="input-wrap">
      ${f.prefix ? `<span class="input-prefix">${f.prefix}</span>` : ""}
      <input class="${inputCls.trim()}" type="${f.type}" value="${val}" placeholder="${f.ph}" oninput="setField('${f.key}', this.value)" ${f.type==="number" ? 'min="0" step="any" inputmode="numeric"' : ''}>
      ${f.suffix ? `<span class="input-suffix">${f.suffix}</span>` : ""}
    </div>
  </div>`;
}

function renderForm(){
  const q = QS[step];
  let qHTML = "";

  if(q.type === "radio"){
    qHTML = `<div class="options">${q.opts.map(o => {
      const sel = ans[q.id] === o.v;
      return `<div class="opt${sel?' selected':''}" onclick="selectOpt('${q.id}','${o.v}')">
        <div class="opt-radio"><div class="opt-dot"></div></div>
        <div class="opt-body"><div class="opt-text">${o.t}</div></div>
      </div>`;
    }).join("")}</div>`;
    if(q.extraInput && ans[q.id] === q.extraInput.showWhen){
      const f = q.extraInput;
      const val = ans[f.key] !== undefined ? String(ans[f.key]).replace(/"/g,'&quot;') : "";
      qHTML += `<div class="extra-input">
        <label class="input-label">${f.label}</label>
        <div class="input-wrap">
          ${f.prefix ? `<span class="input-prefix">${f.prefix}</span>` : ""}
          <input class="${f.prefix?'with-prefix':''}" type="number" value="${val}" placeholder="${f.ph}" oninput="setField('${f.key}', this.value)" min="0" step="any" inputmode="numeric">
        </div>
      </div>`;
    }
  } else if(q.type === "multi"){
    qHTML = `<div class="multi-hint">Sélectionnez tout ce qui s'applique. « Aucun » exclut les autres choix.</div>
      <div class="options">${q.opts.map(o => {
        const sel = Array.isArray(ans[q.id]) && ans[q.id].includes(o.v);
        const noneAttr = q.noneOption ? `,'${q.noneOption}'` : "";
        return `<div class="opt${sel?' selected':''}" onclick="toggleMulti('${q.id}','${o.v}'${noneAttr})">
          <div class="opt-check"><span class="check-icon">✓</span></div>
          <div class="opt-body">
            <div class="opt-text">${o.t}</div>
            ${o.sub ? `<div class="opt-sub">${o.sub}</div>` : ""}
          </div>
        </div>`;
      }).join("")}</div>`;
  } else {
    qHTML = `<div>${q.fields.map(renderField).join("")}</div>`;
  }

  const progress = Math.round((step / QS.length) * 100);
  const isLast = step === QS.length - 1;

  return `<div class="fade">
    <div class="header">
      <div class="header-agency">Quatre Piliers — Comparateur gratuit</div>
      <div class="header-title">Combien vous coûte vraiment votre autogestion ?</div>
      <div class="header-sub">7 questions · Résultat instantané · Méthodologie transparente</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
    <div class="step-label">${q.label}</div>
    <div class="step-q">${q.q}</div>
    ${q.help ? `<div class="step-help">${q.help}</div>` : ""}
    ${qHTML}
    ${formErr ? `<div class="error">${formErr}</div>` : ""}
    <div class="nav">
      ${step > 0 ? `<button class="btn btn-back" onclick="prev()" aria-label="Précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>` : ""}
      <button class="btn ${isLast ? 'btn-cta' : 'btn-next'}" onclick="nextStep()">${isLast ? "Voir mon comparatif" : "Continuer"}</button>
      <span class="step-count">${step+1} / ${QS.length}</span>
    </div>
    <div class="page-footer"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
  </div>`;
}

function renderResult(){
  const r = result;
  const blockClass = r.verdict === "pro_avantageux" ? "crit" : r.verdict === "serre" ? "warn" : "good";

  // Bloc 1 — Coût caché autogestion (décomposition)
  const autoCard = `<div class="proj-card">
    <div class="proj-title">Coût caché de votre autogestion — par an</div>
    <div class="proj-row"><span class="proj-label">Temps bénévole (${fmt(r.heuresMois)} h/mois × 12 × ${fmtCAD(r.tauxHoraire)})</span><span class="proj-value">${fmtCAD(r.coutTemps)}</span></div>
    <div class="proj-row"><span class="proj-label">Incidents — coût annuel amorti sur fréquence typique</span><span class="proj-value">${fmtCAD(r.coutIncidentsAnnualise)}</span></div>
    <div class="proj-row"><span class="proj-label">${r.risqueNonAssure > 0 ? "Risque D&amp;O non couvert (sans assurance)" : "Risque D&amp;O (assurance en place)"}</span><span class="proj-value">${fmtCAD(r.risqueNonAssure)}</span></div>
    <div class="proj-row"><span class="proj-label">Total annuel autogestion</span><span class="proj-value">${fmtCAD(r.coutTotalAutogestion)}</span></div>
  </div>`;

  // Bloc 1 bis — Détail des incidents (si applicable)
  let incidentsDetail = "";
  if(r.incidentsBreakdown.length > 0){
    incidentsDetail = `<div class="proj-card">
      <div class="proj-title">Détail des incidents — coût amorti par fréquence typique</div>
      ${r.incidentsBreakdown.map(i => `<div class="proj-row"><span class="proj-label">${i.label} <span style="color:var(--muted);font-weight:500">(${fmtCAD(i.cost)} ÷ ${i.freqYears} ans)</span></span><span class="proj-value">${fmtCAD(i.annualCost)}/an</span></div>`).join("")}
      <div class="proj-row"><span class="proj-label">Sous-total annuel amorti</span><span class="proj-value">${fmtCAD(r.coutIncidentsAnnualise)}/an</span></div>
    </div>`;
  }

  // Bloc 2 — Coût gestionnaire pro
  const proCard = `<div class="proj-card">
    <div class="proj-title">Coût d'un gestionnaire professionnel équivalent — par an</div>
    <div class="proj-row"><span class="proj-label">${r.nbUnites} unités × ${PRO_RATE_PER_UNIT_MONTH} $ / unité / mois × 12 mois</span><span class="proj-value">${fmtCAD(r.coutProAnnuel)}</span></div>
    <div class="proj-row"><span class="proj-label">Total annuel gestion professionnelle</span><span class="proj-value">${fmtCAD(r.coutProAnnuel)}</span></div>
  </div>`;

  // Bloc 3 — Différence sur 3 ans (gros chiffre coloré)
  const bigfigLabel = r.ecart3ans > 0
    ? "Surcoût de votre autogestion sur 3 ans"
    : r.ecart3ans < 0
    ? "Économie de votre autogestion sur 3 ans"
    : "Coûts équivalents sur 3 ans";
  const bigfigSub = r.ecart3ans > 0
    ? `Soit environ ${fmtCAD(Math.abs(r.ecartAnnuel))} par an de coût supplémentaire par rapport à un gestionnaire professionnel équivalent.`
    : r.ecart3ans < 0
    ? `Soit environ ${fmtCAD(Math.abs(r.ecartAnnuel))} par an que votre bénévolat fait économiser au syndicat — à efficacité équivalente, hors critères qualitatifs.`
    : "Sur le plan financier, les deux modèles s'équivalent. Les critères non financiers vont déterminer la décision.";

  const bigfig = `<div class="bigfig-block ${blockClass}">
    <div class="bigfig-label">Différence cumulée sur 3 ans</div>
    <div class="bigfig-value">${fmt(Math.abs(r.ecart3ans))} $</div>
    <div class="bigfig-sub"><strong style="color:var(--blue-dk)">${bigfigLabel}.</strong> ${bigfigSub}</div>
  </div>`;

  // Section non financière (toujours)
  const nfHTML = `<div class="nf-section">
    <div class="nf-title">Critères non financiers à peser</div>
    <div class="nf-intro">Un comparatif honnête ne s'arrête pas au prix. Quelle que soit la conclusion chiffrée, ces dimensions méritent une discussion en CA.</div>
    <div class="nf-item">
      <div class="nf-icon">1</div>
      <div class="nf-body">
        <div class="nf-name">Fatigue et burnout du CA</div>
        <div class="nf-desc">Le bénévolat use. Vos administrateurs tiendront-ils encore deux, trois, cinq ans à ce rythme sans démotivation ?</div>
      </div>
    </div>
    <div class="nf-item">
      <div class="nf-icon">2</div>
      <div class="nf-body">
        <div class="nf-name">Rotation et recrutement des administrateurs</div>
        <div class="nf-desc">Trouver une relève compétente devient de plus en plus difficile. Quel est votre plan si deux membres quittent simultanément ?</div>
      </div>
    </div>
    <div class="nf-item">
      <div class="nf-icon">3</div>
      <div class="nf-body">
        <div class="nf-name">Conformité Loi 16</div>
        <div class="nf-desc">Carnet d'entretien, étude du fonds de prévoyance tous les 5 ans, formation continue : les obligations s'alourdissent et les sanctions se concrétisent.</div>
      </div>
    </div>
    <div class="nf-item">
      <div class="nf-icon">4</div>
      <div class="nf-body">
        <div class="nf-name">Sérénité des copropriétaires</div>
        <div class="nf-desc">Un syndicat bien encadré rassure les acheteurs, sécurise la valeur de revente et désamorce les conflits internes.</div>
      </div>
    </div>
  </div>`;

  // CTA contextuel
  const isVert = r.verdict === "auto_rentable";
  const ctaLabel = isVert ? "Prochaine étape suggérée" : "Recommandation Quatre Piliers";
  const ctaTitle = isVert
    ? "Discuter d'un accompagnement à la carte"
    : "Demander une soumission de gestion complète";
  const ctaMsg = isVert
    ? "Votre autogestion fonctionne sur le plan financier. Beaucoup de syndicats dans votre situation choisissent un accompagnement ponctuel : appui pour l'AGA, audit annuel, soutien comptable, gestion de crise. Vous gardez la main, vous limitez les risques."
    : "Sur la base de ce comparatif, un gestionnaire professionnel allège votre CA, réduit votre exposition aux risques et préserve la valeur de votre immeuble. Nous bâtissons une proposition adaptée à votre taille et à votre budget.";
  const ctaBtnLabel = isVert ? "✉ Accompagnement à la carte" : "✉ Demander une soumission";

  // Préparation du mailto
  const incLabelList = r.incidentsBreakdown.length > 0 ? r.incidentsBreakdown.map(i => i.label).join(", ") : "Aucun";
  const ancienneteLabel = ans.anciennete === "recent" ? "moins d'un an"
    : ans.anciennete === "intermediaire" ? "1 à 3 ans"
    : ans.anciennete === "experimente" ? "plus de 3 ans"
    : "non renseignée";
  const assuranceLabel = ans.assurance === "oui_connue" ? `Oui — prime annuelle ${r.primeAnnuelle ? fmtCAD(r.primeAnnuelle) : "renseignée"}`
    : ans.assurance === "oui_inconnu" ? "Oui — montant inconnu"
    : ans.assurance === "non" ? "Non"
    : "Inconnue";

  const mailSubject = isVert
    ? `Accompagnement à la carte — ${ans.nom}`
    : `Soumission gestion complète — ${ans.nom}`;
  const mailBody = `Bonjour,

Suite au comparateur autogestion de Quatre Piliers, je souhaite être contacté.

Verdict : ${r.label}

— Syndicat : ${ans.nom}
— Unités : ${ans.nb_unites}
— Année de construction : ${ans.annee}
— CA : ${r.nbAdmins} administrateur(s), ancienneté moyenne ${ancienneteLabel}
— Temps bénévole : ${fmt(r.heuresMois)} h/mois total, valorisé ${fmtCAD(r.tauxHoraire)}/h
— Incidents 24 mois : ${incLabelList}
— Assurance D&O : ${assuranceLabel}

— Coût autogestion annuel : ${fmtCAD(r.coutTotalAutogestion)}
   · Temps bénévole : ${fmtCAD(r.coutTemps)}
   · Incidents (amortis sur fréquence typique) : ${fmtCAD(r.coutIncidentsAnnualise)}
   · Risque non assuré : ${fmtCAD(r.risqueNonAssure)}
— Coût gestionnaire pro annuel : ${fmtCAD(r.coutProAnnuel)}
— Écart annuel : ${fmtSigned(r.ecartAnnuel)}
— Écart cumulé 3 ans : ${fmtSigned(r.ecart3ans)}

Merci de me recontacter pour échanger.`;
  const mailHref = `mailto:info@quatrepiliers.ca?subject=${encodeURIComponent(mailSubject)}&body=${encodeURIComponent(mailBody)}`;

  return `<div class="fade">
    <div class="result-header">
      <div class="result-agency">Quatre Piliers — Comparateur autogestion</div>
      <div class="result-title">Votre comparatif personnalisé</div>
      <div class="result-syndicat">${ans.nom} · ${ans.nb_unites} unités · construit en ${ans.annee}</div>
      <div class="verdict-row">
        <div class="verdict-icon" style="background:${r.color}">${r.icon}</div>
        <div class="verdict-body">
          <div class="verdict-label">${r.label}</div>
          <div class="verdict-resume">${r.txt}</div>
        </div>
      </div>
    </div>

    ${autoCard}
    ${incidentsDetail}
    ${proCard}
    ${bigfig}
    ${nfHTML}

    <div class="method-box">
      <strong>Méthode de calcul :</strong> coût bénévole annuel = heures/mois × 12 × taux horaire. <strong>Incidents amortis sur leur fréquence typique</strong> au Québec — un événement rare ne se reproduit pas chaque année : sinistre mal coordonné 8 000 $ ÷ 10 ans, erreur comptable 3 000 $ ÷ 4 ans, AGA reportée 1 500 $ ÷ 5 ans, conflit majeur 5 000 $ ÷ 8 ans, surcoût travaux 12 000 $ ÷ 8 ans. Risque D&amp;O non couvert : 800 $/an. Tarif gestionnaire professionnel : ${PRO_RATE_PER_UNIT_MONTH} $/unité/mois (médiane Quatre Piliers, Grand Montréal).
    </div>

    <div class="cta-box">
      <div class="cta-label">${ctaLabel}</div>
      <div class="cta-title">${ctaTitle}</div>
      <div class="cta-msg">${ctaMsg}</div>
      <div class="cta-actions">
        <a class="cta-btn cta-btn-gold" href="${mailHref}">${ctaBtnLabel}</a>
        <a class="cta-btn cta-btn-outline" href="tel:5148392494">📞 514-839-2494</a>
      </div>
      <div class="cta-contact"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
    </div>

    <div class="disclaimer"><strong>Avis :</strong> cette estimation utilise des moyennes de l'industrie québécoise (2025-2026). Les chiffres réels varient selon votre situation, votre taille, l'âge de l'immeuble et la qualité de votre gestion actuelle. Ce comparatif ne remplace pas une analyse personnalisée par un professionnel.</div>

    <button class="restart-btn" onclick="restart()">Refaire le comparatif</button>
    <div class="page-footer"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = (phase === "result" && result) ? renderResult() : renderForm();
}

render();
</script>
</body>
</html>
