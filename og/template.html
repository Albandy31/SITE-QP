<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>OG template</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#000}
body{font-family:'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.og{position:relative;width:1200px;height:630px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:60px 70px}
.og::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top right,rgba(255,255,255,.08),transparent 60%);pointer-events:none}
.og::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#E8B800}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.cat{background:rgba(255,255,255,.15);color:#fff;font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:9px 18px;border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{height:54px;width:auto;opacity:.95;filter:brightness(0) invert(1)}
.middle{display:flex;align-items:center;justify-content:space-between;gap:48px;flex:1;position:relative;z-index:2;margin:30px 0}
.title-wrap{flex:1;max-width:680px}
.title{font-family:'Nunito Sans',sans-serif;font-weight:800;color:#fff;font-size:58px;line-height:1.08;letter-spacing:-.015em}
.title.sm{font-size:50px}
.title.xs{font-size:44px}
.gold-bar{width:64px;height:4px;background:#E8B800;margin-top:26px}
.icon{width:240px;height:240px;flex-shrink:0;opacity:.95;display:flex;align-items:center;justify-content:center;color:#fff}
.icon svg{width:100%;height:100%;display:block}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2}
.tagline{color:rgba(255,255,255,.75);font-size:16px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.url{color:#E8B800;font-size:18px;letter-spacing:.12em;font-weight:700}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="top">
    <span class="cat" id="cat"></span>
    <img class="logo" src="/logo.png" alt="Quatre Piliers"/>
  </div>
  <div class="middle">
    <div class="title-wrap">
      <h1 class="title" id="title"></h1>
      <div class="gold-bar"></div>
    </div>
    <div class="icon" id="icon"></div>
  </div>
  <div class="bottom">
    <span class="tagline" id="tagline">Gestion de copropriété</span>
    <span class="url">quatrepiliers.ca</span>

</div>
