<body>
<div class="container" id="app"></div>

<script>
// ==============================================
// VÉRIFICATEUR DE CARNET D'ENTRETIEN — Quatre Piliers
// Conforme art. 1070.2 C.c.Q. (Loi 16, 2019)
// ==============================================

const LEAD_URL = "";

const CATEGORIES = [
  {
    id:"toiture", icon:"🏠",
    titre:"Toiture et étanchéité",
    composants:"membrane, drains, solins, faîtages, ventilation",
    duree:"durée de vie typique : 25 ans",
    fresh:5, isMajor:true
  },
  {
    id:"enveloppe", icon:"🧱",
    titre:"Enveloppe extérieure",
    composants:"revêtement, joints de scellement, fenêtres, portes",
    duree:"durée de vie typique : 40 ans",
    fresh:5, isMajor:false
  },
  {
    id:"balcons", icon:"🚧",
    titre:"Balcons et garde-corps",
    composants:"balcons, garde-corps, dalles d'attache",
    duree:"inspection professionnelle tous les 5 ans (sécurité publique au Québec)",
    fresh:5, isMajor:false, special:"balcons", allowNone:true,
    noneLabel:"L'immeuble n'a pas de balcons"
  },
  {
    id:"ascenseur", icon:"🛗",
    titre:"Ascenseur(s)",
    composants:"cabine, machinerie, dispositifs de sécurité",
    duree:"inspection RBQ annuelle obligatoire (Loi sur le bâtiment)",
    fresh:1, isMajor:false, special:"ascenseur", allowNone:true,
    noneLabel:"Aucun ascenseur dans l'immeuble"
  },
  {
    id:"mecanique", icon:"⚙",
    titre:"Systèmes mécaniques (CVC)",
    composants:"chauffage, ventilation, climatisation, chaudière",
    duree:"durée de vie : 15 à 25 ans selon les équipements",
    fresh:3, isMajor:false
  },
  {
    id:"plomberie", icon:"🚰",
    titre:"Plomberie",
    composants:"colonnes principales, drainage, alimentation",
    duree:"durée de vie typique : 50 ans",
    fresh:5, isMajor:false
  },
  {
    id:"electricite", icon:"⚡",
    titre:"Électricité",
    composants:"panneau principal, distribution, génératrice si applicable",
    duree:"durée de vie : 30 à 40 ans",
    fresh:5, isMajor:false
  },
  {
    id:"structure", icon:"🏛",
    titre:"Structure",
    composants:"fondations, dalles, murs porteurs, charpente",
    duree:"inspection professionnelle recommandée tous les 10 ans",
    fresh:10, isMajor:true
  }
];

const TOTAL_STEPS = CATEGORIES.length + 2; // syndicat + 8 catégories + contact

let step = 0, ans = {}, phase = "form", formErr = "", result = null;

function fmt(n){
  if(typeof n !== "number" || isNaN(n)) return "—";
  return new Intl.NumberFormat('fr-CA', {maximumFractionDigits:0}).format(Math.round(n));
}

function yearsSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return null;
  return (Date.now() - d.getTime()) / (365.25 * 24 * 3600 * 1000);
}

function selectOpt(id, val){ ans[id] = val; formErr = ""; render(); }
function setField(key, val){ ans[key] = val; }
function toggleFlag(key){ ans[key] = !ans[key]; if(ans[key]) ans[key.replace(/_(jamais|nsp_date|none)$/,"_date")] = ""; formErr = ""; render(); }
function toggleNone(catId){
  const k = catId + "_none";
  ans[k] = !ans[k];
  if(ans[k]){
    ans[catId + "_doc"] = "";
    ans[catId + "_date"] = "";
    ans[catId + "_jamais"] = false;
    ans[catId + "_nsp_date"] = false;
    ans[catId + "_plan"] = "";
  }
  formErr = "";
  render();
}
function prev(){ if(step > 0) step--; formErr = ""; render(); }
function restart(){ step = 0; ans = {}; phase = "form"; formErr = ""; result = null; render(); }

function validate(){
  formErr = "";
  if(step === 0){
    if(!ans.nb_unites || parseInt(ans.nb_unites) < 2){ formErr = "Le nombre d'unités doit être au moins 2."; return false; }
    const y = parseInt(ans.annee);
    const now = new Date().getFullYear();
    if(!y || y < 1800 || y > now + 1){ formErr = "Année de construction invalide."; return false; }
    return true;
  }
  if(step === TOTAL_STEPS - 1){
    if(!ans.nom || !ans.nom.trim()){ formErr = "Veuillez saisir le nom du syndicat."; return false; }
    if(!ans.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ans.email)){ formErr = "Adresse courriel invalide."; return false; }
    return true;
  }
  const cat = CATEGORIES[step - 1];
  if(!cat) return true;
  if(cat.allowNone && ans[cat.id + "_none"]) return true;
  if(!ans[cat.id + "_doc"]){ formErr = `Indiquez si « ${cat.titre} » est documenté dans le carnet.`; return false; }
  const hasDate = ans[cat.id + "_date"];
  const jamais = ans[cat.id + "_jamais"];
  const nspDate = ans[cat.id + "_nsp_date"];
  if(!hasDate && !jamais && !nspDate){
    formErr = `Saisissez la date de la dernière inspection pour « ${cat.titre} » (ou cochez « Jamais » ou « Je ne sais pas »).`;
    return false;
  }
  if(!ans[cat.id + "_plan"]){ formErr = `Indiquez si une intervention est planifiée pour « ${cat.titre} ».`; return false; }
  return true;
}

function compute(){
  let score = 100;
  const issues = [];
  const catStatus = {};

  for(const cat of CATEGORIES){
    if(cat.allowNone && ans[cat.id + "_none"]){
      catStatus[cat.id] = { label:"N/A", cls:"st-na", deduction:0 };
      continue;
    }

    const doc = ans[cat.id + "_doc"];
    const dateStr = ans[cat.id + "_date"];
    const jamais = !!ans[cat.id + "_jamais"];
    const nspDate = !!ans[cat.id + "_nsp_date"];
    const plan = ans[cat.id + "_plan"];

    const years = yearsSince(dateStr);
    const isRecent = years !== null && years <= cat.fresh;

    let catDeduction = 0;

    // Documentation : 5 pts
    let docDeduct = 0;
    if(doc === "oui") docDeduct = 0;
    else if(doc === "partiel") docDeduct = 3;
    else if(doc === "non") docDeduct = 5;
    else if(doc === "nsp") docDeduct = 4;
    catDeduction += docDeduct;
    score -= docDeduct;

    // Inspection : 4 pts
    let dateDeduct = 0;
    if(jamais) dateDeduct = 4;
    else if(nspDate) dateDeduct = 3;
    else if(years === null) dateDeduct = 3;
    else if(years <= cat.fresh) dateDeduct = 0;
    else if(years <= cat.fresh * 2) dateDeduct = 2;
    else dateDeduct = 4;
    catDeduction += dateDeduct;
    score -= dateDeduct;

    // Planification : 3 pts
    let planDeduct = 0;
    if(plan === "oui") planDeduct = 0;
    else if(plan === "non") planDeduct = 2;
    else if(plan === "nsp") planDeduct = 3;
    catDeduction += planDeduct;
    score -= planDeduct;

    // Pénalités spéciales
    if(cat.special === "balcons" && !isRecent){
      score -= 10;
      issues.push({
        urgence:"Sécurité publique", cls:"securite", priority:1, cat:cat.titre,
        titre:"Inspection des balcons obligatoire en retard",
        desc:"Au Québec, les structures avec balcons doivent être inspectées par un professionnel tous les 5 ans (Code de construction). Le non-respect engage la responsabilité civile du syndicat en cas d'accident.",
        action:"Mandater dès maintenant un ingénieur en structure pour une inspection complète des balcons, garde-corps et dalles d'attache. Intégrer le rapport au carnet."
      });
    }
    if(cat.special === "ascenseur" && !isRecent){
      score -= 10;
      issues.push({
        urgence:"Obligation légale", cls:"legale", priority:1, cat:cat.titre,
        titre:"Inspection RBQ d'ascenseur en retard",
        desc:"L'inspection annuelle est exigée par la RBQ (Loi sur le bâtiment). Sans inspection à jour, l'ascenseur peut être condamné à tout moment et le syndicat est en infraction.",
        action:"Contacter immédiatement votre contracteur d'entretien pour planifier l'inspection RBQ et corriger les anomalies. Conserver chaque rapport annuel au carnet."
      });
    }
    if(cat.isMajor && (doc === "non" || doc === "nsp")){
      score -= 8;
      issues.push({
        urgence:"Critique", cls:"critique", priority:2, cat:cat.titre,
        titre:`Composant majeur absent du carnet : ${cat.titre.toLowerCase()}`,
        desc:`${cat.titre} est un composant majeur du bâtiment (${cat.duree}). Son absence du carnet rend impossible la planification du remplacement et compromet directement la fiabilité de l'étude du fonds de prévoyance.`,
        action:`Faire réaliser une inspection professionnelle de la catégorie « ${cat.titre.toLowerCase()} » et intégrer au carnet : inventaire des composants, état actuel, dates d'installation, plan de remplacement.`
      });
    } else if(doc === "non"){
      issues.push({
        urgence:"Important", cls:"importante", priority:3, cat:cat.titre,
        titre:`${cat.titre} : aucune documentation`,
        desc:`Composants à intégrer : ${cat.composants}. ${cat.duree.charAt(0).toUpperCase() + cat.duree.slice(1)}.`,
        action:`Documenter dans le carnet : inventaire des composants, état actuel, dates d'installation et plan d'inspection.`
      });
    } else if(doc === "partiel"){
      issues.push({
        urgence:"Planification", cls:"planif", priority:4, cat:cat.titre,
        titre:`${cat.titre} : documentation à compléter`,
        desc:`Le carnet contient des éléments partiels. Composants à compléter : ${cat.composants}.`,
        action:`Compléter le dossier : ajouter les éléments manquants, joindre les factures, rapports professionnels et certificats disponibles.`
      });
    } else if(doc === "nsp"){
      issues.push({
        urgence:"Planification", cls:"planif", priority:5, cat:cat.titre,
        titre:`${cat.titre} : statut documentation inconnu`,
        desc:`Vérifier ce qui figure déjà dans le carnet pour : ${cat.composants}.`,
        action:`Faire un audit du carnet pour identifier ce qui est documenté et ce qui manque.`
      });
    }

    // Inspections obsolètes (hors catégories spéciales déjà traitées)
    if(!cat.special){
      if(jamais){
        issues.push({
          urgence: cat.isMajor ? "Sécurité" : "Important", cls: cat.isMajor ? "securite" : "importante",
          priority: cat.isMajor ? 2 : 3, cat:cat.titre,
          titre:`${cat.titre} : aucune inspection professionnelle`,
          desc:`Sans inspection, il est impossible d'évaluer l'état réel des composants ou d'anticiper les travaux. ${cat.duree.charAt(0).toUpperCase() + cat.duree.slice(1)}.`,
          action:`Mandater un professionnel pour une inspection de référence. Le rapport servira de base au carnet et à la prochaine étude du fonds de prévoyance.`
        });
      } else if(years !== null && years > cat.fresh * 2){
        issues.push({
          urgence:"Planification", cls:"planif", priority:5, cat:cat.titre,
          titre:`${cat.titre} : inspection ancienne (${Math.floor(years)} ans)`,
          desc:`La dernière inspection date de plus de ${Math.floor(years)} ans. Une mise à jour est nécessaire pour valider l'état actuel et fiabiliser la planification.`,
          action:`Planifier une nouvelle inspection professionnelle dans les 12 prochains mois et l'inscrire au carnet.`
        });
      }
    }

    if(plan === "non" && cat.isMajor){
      issues.push({
        urgence:"Planification", cls:"planif", priority:5, cat:cat.titre,
        titre:`${cat.titre} : aucune intervention planifiée`,
        desc:`Sans planification d'entretien préventif pour un composant majeur, les travaux risquent d'être réalisés en urgence — souvent à un coût multiplié par 2 ou 3, avec recours possible à une cotisation spéciale.`,
        action:`Inscrire au carnet : type d'intervention prévue, échéance estimée, budget prévisionnel rattaché au fonds de prévoyance.`
      });
    }

    // Statut catégorie pour le récapitulatif visuel
    if(catDeduction === 0) catStatus[cat.id] = { label:"Conforme", cls:"st-ok" };
    else if(catDeduction <= 4) catStatus[cat.id] = { label:"À surveiller", cls:"st-warn" };
    else if(catDeduction <= 8) catStatus[cat.id] = { label:"Incomplet", cls:"st-warn" };
    else catStatus[cat.id] = { label:"À risque", cls:"st-crit" };
  }

  score = Math.max(0, Math.min(100, score));

  let niveau, color, verdictIcon, verdictTxt;
  if(score >= 80){
    niveau = "Conforme"; color = "#0F6E56"; verdictIcon = "✓";
    verdictTxt = "Votre carnet d'entretien respecte largement les exigences de la Loi 16. Maintenez ce niveau en planifiant les mises à jour régulières.";
  } else if(score >= 60){
    niveau = "En progrès"; color = "#2A4D9E"; verdictIcon = "△";
    verdictTxt = "Le cadre est en place mais plusieurs éléments restent à documenter ou à inspecter pour atteindre la conformité.";
  } else if(score >= 40){
    niveau = "À risque"; color = "#854F0B"; verdictIcon = "⚠";
    verdictTxt = "Votre carnet présente des lacunes importantes. Plusieurs catégories doivent être traitées avant la prochaine étude du fonds de prévoyance.";
  } else {
    niveau = "Critique"; color = "#A32D2D"; verdictIcon = "!";
    verdictTxt = "Le carnet n'est pas en état de répondre aux exigences de l'article 1070.2 C.c.Q. Une intervention coordonnée par un gestionnaire est urgente.";
  }

  issues.sort((a,b) => a.priority - b.priority);

  return { score, niveau, color, verdictIcon, verdictTxt, issues, catStatus };
}

function renderSyndicat(){
  return `
    <div class="input-group">
      <label class="input-label">Nombre d'unités *</label>
      <input type="number" value="${ans.nb_unites||''}" placeholder="Ex : 24" min="2" inputmode="numeric" oninput="setField('nb_unites', this.value)">
    </div>
    <div class="input-group">
      <label class="input-label">Année de construction *</label>
      <input type="number" value="${ans.annee||''}" placeholder="Ex : 2008" min="1800" max="${new Date().getFullYear()+1}" inputmode="numeric" oninput="setField('annee', this.value)">
    </div>
  `;
}

function renderCategoryStep(cat){
  const noneChecked = cat.allowNone && !!ans[cat.id + "_none"];
  const jamais = !!ans[cat.id + "_jamais"];
  const nspDate = !!ans[cat.id + "_nsp_date"];
  const dateDisabled = jamais || nspDate;
  const today = new Date().toISOString().slice(0,10);

  const docOpts = [
    {v:"oui", t:"Oui, complet et conservé au registre"},
    {v:"partiel", t:"Partiellement / document informel"},
    {v:"non", t:"Non, absent du carnet"},
    {v:"nsp", t:"Je ne sais pas"}
  ];
  const planOpts = [
    {v:"oui", t:"Oui, intervention planifiée"},
    {v:"non", t:"Non, aucune planification"},
    {v:"nsp", t:"Je ne sais pas"}
  ];

  let html = `<div class="cat-block">
    <div class="cat-icon">${cat.icon}</div>
    <div>
      <div class="cat-title">${cat.titre}</div>
      <div class="cat-sub">${cat.composants} · ${cat.duree}</div>
    </div>
  </div>`;

  if(cat.allowNone){
    html += `<div class="nsp-row${noneChecked?' checked':''}" onclick="toggleNone('${cat.id}')" style="margin-bottom:1rem">
      <div class="nsp-check"><span class="nsp-check-icon">✓</span></div>
      <span>${cat.noneLabel}</span>
    </div>`;
  }

  if(noneChecked){
    return html + `<div class="none-banner">Cette catégorie ne s'applique pas à votre immeuble. Passez à la suivante.</div>`;
  }

  // Sub-question 1: Documentation
  html += `<div class="sub-q">
    <div class="sub-q-label"><span class="sub-q-num">Q1.</span> Documenté dans le carnet ?</div>
    <div class="options">${docOpts.map(o => {
      const sel = ans[cat.id+"_doc"] === o.v;
      return `<div class="opt${sel?" selected":""}" onclick="selectOpt('${cat.id}_doc','${o.v}')">
        <div class="opt-radio"><div class="opt-dot"></div></div>
        <div class="opt-text">${o.t}</div>
      </div>`;
    }).join("")}</div>
  </div>`;

  // Sub-question 2: Date inspection
  const inspectionLabel = cat.special === "ascenseur"
    ? "Date de la dernière inspection RBQ"
    : cat.special === "balcons"
    ? "Date de la dernière inspection professionnelle des balcons"
    : "Date de la dernière inspection professionnelle";

  html += `<div class="sub-q">
    <div class="sub-q-label"><span class="sub-q-num">Q2.</span> ${inspectionLabel}</div>
    <input type="date" max="${today}" min="1950-01-01" value="${ans[cat.id+'_date']||''}" oninput="setField('${cat.id}_date', this.value); render();" ${dateDisabled?'disabled':''}>
    <div class="nsp-stack">
      <div class="nsp-row${jamais?' checked':''}" onclick="toggleFlag('${cat.id}_jamais')">
        <div class="nsp-check"><span class="nsp-check-icon">✓</span></div>
        <span>Jamais inspecté professionnellement</span>
      </div>
      <div class="nsp-row${nspDate?' checked':''}" onclick="toggleFlag('${cat.id}_nsp_date')">
        <div class="nsp-check"><span class="nsp-check-icon">✓</span></div>
        <span>Je ne sais pas / date non accessible</span>
      </div>
    </div>
  </div>`;

  // Sub-question 3: Planning
  html += `<div class="sub-q">
    <div class="sub-q-label"><span class="sub-q-num">Q3.</span> Prochaine intervention planifiée ?</div>
    <div class="options">${planOpts.map(o => {
      const sel = ans[cat.id+"_plan"] === o.v;
      return `<div class="opt${sel?" selected":""}" onclick="selectOpt('${cat.id}_plan','${o.v}')">
        <div class="opt-radio"><div class="opt-dot"></div></div>
        <div class="opt-text">${o.t}</div>
      </div>`;
    }).join("")}</div>
  </div>`;

  return html;
}

function renderContact(){
  return `
    <div class="input-group">
      <label class="input-label">Nom du syndicat *</label>
      <input type="text" value="${(ans.nom||'').replace(/"/g,'&quot;')}" placeholder="Ex : Syndicat des copropriétaires du 123 Maple" oninput="setField('nom', this.value)">
    </div>
    <div class="input-group">
      <label class="input-label">Courriel *</label>
      <input type="email" value="${(ans.email||'').replace(/"/g,'&quot;')}" placeholder="votre@courriel.com" oninput="setField('email', this.value)">
    </div>
    <div class="input-group">
      <label class="input-label">Votre nom (optionnel)</label>
      <input type="text" value="${(ans.nom_contact||'').replace(/"/g,'&quot;')}" placeholder="Prénom Nom" oninput="setField('nom_contact', this.value)">
    </div>
  `;
}

function renderForm(){
  const isFirst = step === 0;
  const isLast = step === TOTAL_STEPS - 1;
  const isContact = isLast;
  const isSyndicat = isFirst;

  let stepLabel, stepQ, stepHelp, qHTML;

  if(isSyndicat){
    stepLabel = `Étape 1 sur ${TOTAL_STEPS}`;
    stepQ = "Caractéristiques de votre immeuble";
    stepHelp = "Quelques informations factuelles pour calibrer la vérification. Vous renseignerez le nom du syndicat à la fin.";
    qHTML = renderSyndicat();
  } else if(isContact){
    stepLabel = `Étape ${TOTAL_STEPS} sur ${TOTAL_STEPS}`;
    stepQ = "Recevez votre rapport personnalisé";
    stepHelp = "Le nom du syndicat sert uniquement à personnaliser votre rapport, il ne sera jamais partagé. Aucun spam.";
    qHTML = renderContact();
  } else {
    const cat = CATEGORIES[step - 1];
    stepLabel = `Étape ${step + 1} sur ${TOTAL_STEPS} — Catégorie ${step} / ${CATEGORIES.length}`;
    stepQ = `Évaluez : ${cat.titre}`;
    stepHelp = "Trois questions courtes : documentation, dernière inspection professionnelle, prochaine planification.";
    qHTML = renderCategoryStep(cat);
  }

  const progress = Math.round((step / (TOTAL_STEPS - 1)) * 100);

  return `<div class="fade">
    <div class="header">
      <div class="header-agency">Quatre Piliers — Vérificateur gratuit</div>
      <div class="header-title">Votre carnet d'entretien est-il conforme à la Loi 16 ?</div>
      <div class="header-sub">Article 1070.2 C.c.Q. · ${TOTAL_STEPS} étapes · Score et plan d'action instantanés</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
    <div class="step-label">${stepLabel}</div>
    <div class="step-q">${stepQ}</div>
    <div class="step-help">${stepHelp}</div>
    ${qHTML}
    ${formErr ? `<div class="error">${formErr}</div>` : ""}
    <div class="nav">
      ${step > 0 ? `<button class="btn btn-back" onclick="prev()" aria-label="Précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>` : ""}
      <button class="btn ${isLast ? 'btn-cta' : 'btn-next'}" onclick="nextStep()">${isLast ? "Voir mon score de conformité" : "Continuer"}</button>
      <span class="step-count">${step+1} / ${TOTAL_STEPS}</span>
    </div>
    <div class="page-footer"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
  </div>`;
}

function nextStep(){
  if(!validate()){ render(); return; }
  if(step < TOTAL_STEPS - 1){ step++; render(); return; }
  result = compute();
  phase = "result";
  if(LEAD_URL){
    try{
      fetch(LEAD_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ source:"verificateur-carnet", answers: ans, result })
      }).catch(()=>{});
    } catch(_){}
  }
  window.scrollTo({top:0, behavior:"smooth"});
  render();
}

function renderResult(){
  const r = result;

  // Récapitulatif visuel des 8 catégories
  const catCards = CATEGORIES.map(cat => {
    const st = r.catStatus[cat.id] || { label:"—", cls:"st-na" };
    return `<div class="cat-card">
      <span class="cat-card-icon">${cat.icon}</span>
      <span class="cat-card-name">${cat.titre}</span>
      <span class="cat-card-status ${st.cls}">${st.label}</span>
    </div>`;
  }).join("");

  // Liste priorisée des manques
  let issuesHTML;
  if(r.issues.length === 0){
    issuesHTML = `<div class="no-issues">
      <strong>Aucun manque majeur détecté.</strong> Votre carnet est en excellent état. Pensez à le mettre à jour à chaque intervention et à le réviser annuellement.
    </div>`;
  } else {
    issuesHTML = r.issues.map(i => `<div class="issue l-${i.cls}">
      <div class="issue-head">
        <span class="urgence-badge u-${i.cls}">${i.urgence}</span>
        <span class="issue-cat">${i.cat}</span>
      </div>
      <div class="issue-titre">${i.titre}</div>
      <div class="issue-desc">${i.desc}</div>
      <div class="issue-action"><strong>À faire :</strong> ${i.action}</div>
    </div>`).join("");
  }

  const ctaTitle = r.score >= 80
    ? "Faites auditer votre carnet par un professionnel"
    : r.score >= 60
    ? "Coordonnez la mise à niveau de votre carnet"
    : "Confiez la production de votre carnet à Quatre Piliers";

  const ctaMsg = r.score >= 80
    ? "Excellent travail. Un audit indépendant tous les 5 ans permet de garantir que votre carnet reste opposable et utile à l'étude du fonds de prévoyance."
    : r.score >= 60
    ? "Votre carnet a une bonne base mais doit être consolidé. Nous coordonnons les inspections, centralisons les rapports professionnels et mettons le carnet à un niveau conforme à l'article 1070.2 C.c.Q."
    : "Nous orchestrons l'ensemble : audit de l'existant, inspections professionnelles requises, rédaction du carnet et mise en place du suivi. Vous obtenez un document opposable, prêt pour l'AGA et l'étude du fonds.";

  const mailBody = `Bonjour,\n\nSuite au vérificateur de carnet d'entretien Loi 16 de Quatre Piliers, je souhaite être contacté.\n\nSyndicat : ${ans.nom}\nUnités : ${ans.nb_unites}\nAnnée de construction : ${ans.annee}\nScore de conformité : ${r.score}/100 (${r.niveau})\nNombre de manques identifiés : ${r.issues.length}\n\nMerci.`;
  const mailHref = `mailto:info@quatrepiliers.ca?subject=${encodeURIComponent("Carnet d'entretien — " + ans.nom)}&body=${encodeURIComponent(mailBody)}`;

  return `<div class="fade">
    <div class="result-header">
      <div class="result-agency">Quatre Piliers — Vérificateur Loi 16</div>
      <div class="result-title">Conformité de votre carnet d'entretien</div>
      <div class="result-syndicat">${ans.nom} · ${ans.nb_unites} unités · construit en ${ans.annee}</div>
      <div class="score-row">
        <div class="score-circle" style="background:${r.color}">${r.score}</div>
        <div>
          <div class="score-niveau">${r.verdictIcon} ${r.niveau}</div>
          <div class="score-resume">${r.verdictTxt}</div>
        </div>
      </div>
    </div>

    <div class="section-label">Statut par catégorie</div>
    <div class="cat-summary">${catCards}</div>

    <div class="section-label">Manques prioritaires & plan d'action</div>
    ${issuesHTML}

    <div class="budget-box">
      <div class="budget-label">Estimation budget</div>
      <div class="budget-title">Mise à niveau d'un carnet : 2 000 à 5 000 $</div>
      <div class="budget-msg">Pour un syndicat de taille moyenne (20 à 40 unités). <strong>Économies sur le long terme :</strong> un carnet à jour évite les cotisations spéciales d'urgence — qui coûtent typiquement 5 à 10 fois plus que les interventions planifiées au bon moment.</div>
    </div>

    <div class="crosslink">
      <div class="crosslink-icon">📊</div>
      <div class="crosslink-text">
        <div class="crosslink-title">Étape suivante : fiabilisez votre fonds de prévoyance</div>
        <div class="crosslink-msg">Un carnet bien tenu fiabilise directement votre étude du fonds.</div>
      </div>
      <a class="crosslink-link" href="calculateur-fonds-prevoyance.html">Calculateur →</a>
    </div>

    <div class="cta-box">
      <div class="cta-label">${r.score < 60 ? "Recommandation prioritaire" : "Prochaine étape"}</div>
      <div class="cta-title">${ctaTitle}</div>
      <div class="cta-msg">${ctaMsg}</div>
      <div class="cta-actions">
        <a class="cta-btn cta-btn-gold" href="${mailHref}">✉ Demander un accompagnement</a>
        <a class="cta-btn cta-btn-outline" href="tel:5148392494">📞 514-839-2494</a>
      </div>
      <div class="cta-contact"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
    </div>

    <div class="disclaimer"><strong>Source légale :</strong> l'article 1070.2 du Code civil du Québec (introduit par la Loi 16, 2019) impose à tout syndicat de copropriété de tenir un carnet d'entretien des parties communes. Cette vérification est une auto-évaluation indicative et ne remplace pas la production d'un carnet par un professionnel qualifié.</div>

    <button class="restart-btn" onclick="restart()">Recommencer la vérification</button>
    <div class="page-footer"><a href="https://quatrepiliers.ca/" target="_blank" rel="noopener">www.quatrepiliers.ca</a></div>
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = (phase === "result" && result) ? renderResult() : renderForm();
}

render();
</script>
